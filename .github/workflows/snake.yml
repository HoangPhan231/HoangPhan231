name: 🐾 GitHub Snake Game Ultimate

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-game:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Generate amazing animated characters

    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🎨 Generate Animations with Dynamic Characters
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/dragon-chasing.svg?character=dragon&effect=fire
            dist/unicorn-dance.svg?character=unicorn&effect=rainbow
            dist/robot-explorer.svg?character=robot&effect=laser
            dist/spacecraft-flyby.svg?character=spacecraft&effect=stars
            dist/leaderboard.json?mode=community

      - name: 🛠️ Install ImageMagick
        if: steps.snake.outputs.has_changes == 'true'
        run: sudo apt-get install -y imagemagick

      - name: ✨ Optimize Animations
        if: steps.snake.outputs.has_changes == 'true'
        run: |
          convert dist/robot-explorer.svg -resize 800x400 -layers optimize dist/robot-optimized.gif
          convert dist/spacecraft-flyby.svg -resize 800x400 -layers optimize dist/spacecraft-optimized.gif

      - name: 📝 Generate README with Leaderboard
        if: steps.snake.outputs.has_changes == 'true'
        run: |
          cat << EOF > README.md
          # 🐾 GitHub Contribution Game Ultimate

          ![Workflow Status](https://img.shields.io/github/actions/workflow/status/${{ github.repository }}/snake.yml?label=Snake%20Game&style=for-the-badge)

          ## 🎮 Amazing Animated Characters

          ### Dragon Chasing with Fire
          ![Dragon](https://raw.githubusercontent.com/${{ github.repository }}/output/dist/dragon-chasing.svg)

          ### Unicorn Dancing with Rainbow
          ![Unicorn](https://raw.githubusercontent.com/${{ github.repository }}/output/dist/unicorn-dance.svg)

          ### Robot Explorer with Laser
          ![Robot](https://raw.githubusercontent.com/${{ github.repository }}/output/dist/robot-optimized.gif)

          ### Spacecraft Flyby with Stars
          ![Spacecraft](https://raw.githubusercontent.com/${{ github.repository }}/output/dist/spacecraft-optimized.gif)

          ## 🏆 Leaderboard
          View the [Community Leaderboard](https://raw.githubusercontent.com/${{ github.repository }}/output/dist/leaderboard.json) to see top contributors!

          *Auto-generated with ❤️ by GitHub Actions*
          EOF

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output

      - name: 🔄 Create Pull Request
        if: github.ref != 'refs/heads/output' && steps.snake.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v4
        with:
          title: "✨ Update Animations with Dynamic Characters"
          branch: "update-ultimate-characters"
          base: "main"
          body: "Added animations for new dynamic characters with effects (dragon, unicorn, robot, spacecraft). Includes leaderboard integration."
          commit-message: "Update ultimate character animations [skip ci]"
