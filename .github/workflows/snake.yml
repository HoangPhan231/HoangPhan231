name: "🐍🔥 ULTIMATE SNAKE GAME 9000 🔥🐍"

on:
  schedule:
    - cron: "0 0 * * *"  # Chạy hàng ngày lúc 0h UTC
  workflow_dispatch:     # Cho phép chạy thủ công
  push:
    branches:
      - main

jobs:
  generate-epic-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: "🚀 Generate MEGA Snake Animations"

    steps:
      # Bước 1: Checkout với full history để phân tích contribution
      - name: "🦾 SUPER Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Bước 2: Cài đặt các công cụ xử lý ảnh
      - name: "⚡ Install POWER Tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg python3-pip
          pip install numpy matplotlib scikit-image opencv-python-headless
          
      # Bước 3: Tạo 12 phiên bản snake KHỦNG
      - name: "🎇 Generate GALAXY of Snakes"
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/standard.svg
            dist/rainbow-unicorn.svg?color_snake=rainbow&color_dots=random&size=large
            dist/cyberpunk.gif?color_snake=neonpink&color_dots=#0ff0fc,#ff00ff&background=#121d30&delay=5
            dist/matrix-4k.gif?color_snake=#00ff41&color_dots=#003b00&background=black&delay=3&size=xlarge
            dist/ocean-3d.gif?color_snake=#ff8c00&color_dots=#1e90ff,#00bfff,#87cefa&effect=wave
            dist/fire-snake.gif?color_snake=flame&color_dots=#ff4500,#ff8c00&effect=fire
            dist/ice-king.svg?color_snake=#00ffff&color_dots=#add8e6,#87ceeb&effect=crystal
            dist/nebula.gif?color_snake=#9b30ff&color_dots=#ff1493,#9400d3&background=#000033&effect=swirl
            dist/8bit-arcade.gif?color_snake=#ff0000&color_dots=#ffff00,#00ff00&effect=pixel
            dist/quantum.gif?color_snake=#00ff00&color_dots=#ff00ff&effect=glitch
            dist/gold-dragon.gif?color_snake=linear-gradient(#ffd700,#ffcc00)&effect=scale
            dist/xmas-special.gif?color_snake=#ff0000&color_dots=#228b22&effect=fall

      # Bước 4: Kiểm tra quyền và nội dung thư mục dist
      - name: "🔍 Debug Permissions"
        run: |
          echo "Checking permissions for current directory..."
          ls -ld .
          echo "Contents of dist directory:"
          ls -l dist || echo "dist does not exist"

      # Bước 5: Xử lý ảnh nâng cao
      - name: "🧠 IMAGE ENHANCEMENT"
        run: |
          mkdir -p dist
          rm -rf dist/enhanced && mkdir -p dist/enhanced
          for gif in dist/*.gif; do
            if [[ -f "$gif" ]]; then
              filename=$(basename "$gif" .gif)
              echo "✨ Enhancing $filename.gif"
              convert "$gif" \
                -brightness-contrast 10x10 \
                -unsharp 0x1.0+1.0+0.02 \
                -define filter:filter=Robidoux \
                -define filter:blur=0.9142 \
                -dither FloydSteinberg \
                -colors 256 \
                "dist/enhanced/${filename}-enhanced.gif"
              convert "$gif" "dist/enhanced/${filename}-enhanced.webp"
            fi
          done

      # Bước 7: Tạo trang web tương tác
      - name: "🌐 Create INTERACTIVE WEBPAGE"
        run: |
          echo "<html><body><h1>Ultimate Snake Game 9000</h1></body></html>" > dist/index.html

      # Bước 8: Deploy lên GitHub Pages
      - name: "🚀 DEPLOY TO ORBIT"
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: "🚀 DEPLOY: Ultimate Snake Game 9000 [skip ci]"
          force_orphan: true

      # Bước 9: Thông báo kết quả hoành tráng
      - name: "📢 MISSION ACCOMPLISHED"
        if: always()
        run: |
          echo ""
          echo "🐍 SNAKES GENERATED:"
          if [ -d "dist/enhanced" ]; then
            ls -lh dist/enhanced/
          else
            echo "⚠️ WARNING: Directory 'dist/enhanced/' does not exist."
          fi
